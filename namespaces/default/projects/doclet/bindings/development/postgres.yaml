apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: doclet-postgres-development
  namespace: default
spec:
  owner:
    projectName: doclet
    resourceName: doclet-postgres
  environment: development
  # The Resource controller names releases <resource>-<hash>, where the hash covers the
  # Resource spec and platform-shared/cluster-resource-types/postgres.yaml. Update this pin
  # (kubectl get resource doclet-postgres -o jsonpath='{.status.latestRelease.name}')
  # whenever either of them changes.
  resourceRelease: doclet-postgres-78d95c5fcb
  retainPolicy: Delete
  resourceTypeEnvironmentConfigs:
    adminEnabled: false
