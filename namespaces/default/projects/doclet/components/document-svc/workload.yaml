apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: document-svc-workload
  namespace: default
spec:
  container:
    env:
    - key: DOCLET_DOCUMENT_ADDR
      value: :8080
    image: host.k3d.internal:10082/doclet-document-svc-image:v1-4a2acc61
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    resources:
      - ref: doclet-postgres
        envBindings:
          host: DB_HOST
          port: DB_PORT
          username: DB_USER
          password: DB_PASSWORD
          database: DB_NAME
      - ref: doclet-nats
        envBindings:
          url: DOCLET_NATS_URL
  owner:
    componentName: document-svc
    projectName: doclet
